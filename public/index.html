<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1720">
<title>Overhead</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0; height: 100%; background: #0f1720; font-family: system-ui, -apple-system, sans-serif; }
  #map { position: absolute; inset: 0; background: #1b1f24; }
  /* Turn the standard OSM tiles into a dark map (set to "none" for a light map) */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.7); }
  .bar {
    position: absolute; z-index: 1000; left: 10px; right: 10px;
    top: calc(env(safe-area-inset-top) + 10px);
    display: flex; gap: 8px; align-items: center; justify-content: space-between;
    pointer-events: none;
  }
  .pill {
    pointer-events: auto; background: rgba(15,23,32,.88); color: #e6edf3;
    padding: 8px 12px; border-radius: 999px; font-size: 13px;
    border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px);
  }
  button.pill { font: inherit; font-size: 13px; cursor: pointer; }
  .plane { will-change: transform; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  .plane svg { display: block; }
  .label {
    position: absolute; left: 20px; top: -2px; white-space: nowrap;
    font-size: 11px; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000;
    pointer-events: none;
  }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.5; }
  .leaflet-popup-content b { font-size: 15px; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .row span:first-child { color: #667; }
  .row span:last-child { text-align: right; }
  .muted { color: #889; font-size: 12px; margin: 4px 0; }
  .airline { font-size: 12px; color: #667; margin-bottom: 2px; }
  .route { margin: 6px 0 4px; padding: 8px 10px; border-radius: 8px; background: rgba(120,140,170,.15); }
  .route.unconfirmed { background: rgba(200,160,60,.14); }
  .route .codes { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .route .arrow { flex: 1; text-align: center; color: #889; font-weight: 400; }
  .route .cities { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: #667; margin-top: 2px; }
  .route .cities span:last-child { text-align: right; }
  .route .note { font-size: 11px; color: #667; margin-top: 4px; }
  .apt-tip { font-weight: 700; }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <div class="pill" id="status">Starting…</div>
  <button class="pill" id="locate">📍 Locate me</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- Settings you may want to tweak ----
// Leave empty when this page is served by the same Cloudflare Worker as the API.
const PROXY_URL = "";
const POLL_MS = 6000;               // how often to ask the feed for new positions
const MAX_RADIUS_NM = 250;
const TRAIL_POINTS = 25;
const DEFAULT_CENTER = [53.7938, -1.7564];          // fallback if location is denied
const DEFAULT_ZOOM = 9;

// Smooth movement
const FRAME_MS = 33;                // redraw roughly 30 times a second
const BLEND_MS = 1200;              // new data is eased in over about this long instead of snapping
const MAX_EXTRAP_S = 25;            // stop predicting if a plane's data is older than this
const KEEP_MISSING_MS = 15000;      // keep a plane on screen this long if the feed briefly drops it
const RAD = Math.PI / 180;

// ---- Map ----
const map = L.map("map", { zoomControl: false, attributionControl: true })
  .setView(DEFAULT_CENTER, DEFAULT_ZOOM);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

L.control.zoom({ position: "bottomright" }).addTo(map);

const statusEl = document.getElementById("status");
const aircraft = new Map();   // hex -> entry (see makeEntry)
let youMarker = null;
let selectedHex = null;
let zooming = false;
map.on("zoomstart", () => { zooming = true; });
map.on("zoomend", () => { zooming = false; });

// ---- Helpers ----
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function altColour(alt) {
  if (alt === "ground" || alt == null) return "#9aa5b1";
  if (alt < 2000)  return "#ff6b6b";
  if (alt < 10000) return "#ffb347";
  if (alt < 25000) return "#f4e04d";
  if (alt < 35000) return "#4fd1c5";
  return "#63b3ff";
}

const labelFor = ac => (ac.flight || "").trim() || ac.r || ac.hex;

function planeIcon(ac) {
  return L.divIcon({
    className: "",
    iconSize: [24, 24],
    iconAnchor: [12, 12],
    popupAnchor: [0, -10],
    html: `
      <div class="plane">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path fill="${altColour(ac.alt_baro)}" stroke="#0f1720" stroke-width="1"
            d="M12 1.5c.9 0 1.5.8 1.5 1.8v6.2l8 4.6v2.2l-8-2.3v4.6l2.3 1.7V22L12 20.7 8.2 22v-1.7l2.3-1.7v-4.6l-8 2.3v-2.2l8-4.6V3.3c0-1 .6-1.8 1.5-1.8z"/>
        </svg>
      </div>
      <div class="label">${esc(labelFor(ac))}</div>`
  });
}

function fmtAlt(a) {
  if (a === "ground") return "On ground";
  if (a == null) return "–";
  return a >= 18000 ? `FL${Math.round(a / 100)}` : `${a.toLocaleString()} ft`;
}

// ---- Geometry ----
const R_NM = 3440.065;

function distNm(lat1, lon1, lat2, lon2) {
  const dLat = (lat2 - lat1) * RAD, dLon = (lon2 - lon1) * RAD;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * RAD) * Math.cos(lat2 * RAD) * Math.sin(dLon / 2) ** 2;
  return 2 * R_NM * Math.asin(Math.sqrt(x));
}

function bearing(lat1, lon1, lat2, lon2) {
  const p1 = lat1 * RAD, p2 = lat2 * RAD, dl = (lon2 - lon1) * RAD;
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) / RAD + 360) % 360;
}

const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);

function fmtDur(min) {
  if (min < 1) return "<1 min";
  return min < 60 ? `${Math.round(min)} min` : `${Math.floor(min / 60)} h ${Math.round(min % 60)} min`;
}

// ---- Route checking ----
// Route databases keep one entry per callsign, but a callsign can fly several legs and
// entries go stale. So every candidate leg is tested against where the plane really is.
// Returns a score (lower = better fit) or null if the plane can't plausibly be on this leg.
function fitLeg(a, b, ac) {
  if (a?.lat == null || a?.lon == null || b?.lat == null || b?.lon == null) return null;
  const len = distNm(a.lat, a.lon, b.lat, b.lon);
  if (len < 5) return null;
  const toA = distNm(a.lat, a.lon, ac.lat, ac.lon);
  const toB = distNm(b.lat, b.lon, ac.lat, ac.lon);
  const nearEnd = Math.min(toA, toB);

  // Parked or taxiing: only plausible if it is at one of the two airports
  if (ac.alt_baro === "ground") return nearEnd < 15 ? nearEnd : null;

  // How far off the straight line between the airports, and how far along it
  const d13 = toA / R_NM;
  const t13 = bearing(a.lat, a.lon, ac.lat, ac.lon) * RAD;
  const t12 = bearing(a.lat, a.lon, b.lat, b.lon) * RAD;
  const xt = Math.asin(Math.sin(d13) * Math.sin(t13 - t12)) * R_NM;
  let along = Math.acos(Math.max(-1, Math.min(1, Math.cos(d13) / Math.cos(xt / R_NM)))) * R_NM;
  if (Math.cos(t13 - t12) < 0) along = -along;

  // The corridor is narrow near the airports and widens towards mid-route (long oceanic
  // flights can sit a couple of hundred miles off the straight line), but never beyond 250 nm.
  if (Math.abs(xt) > Math.min(250, 40 + 0.25 * nearEnd)) return null;
  if (along < -50 || along > len + 50) return null;             // outside the two airports

  let headingPenalty = 0;
  if (nearEnd > 40 && ac.track != null) {                       // near an airport planes turn, so skip
    const diff = angDiff(ac.track, bearing(ac.lat, ac.lon, b.lat, b.lon));
    if (diff > 90) return null;                                 // heading away from the destination
    headingPenalty = diff / 180 * 20;
  }
  return Math.abs(xt) + headingPenalty;
}

// Picks the best leg across all candidate routes, or reports that none fits.
function routeFor(ac, info) {
  if (!info || typeof info !== "object" || !info.routes?.length) return null;
  const cands = [];
  for (const r of info.routes) {
    const aps = r.airports || [];
    for (let i = 0; i + 1 < aps.length; i++) {
      const forward = fitLeg(aps[i], aps[i + 1], ac);
      if (forward != null) cands.push({ source: r.source, from: aps[i], to: aps[i + 1], reversed: false, score: forward });
      const back = fitLeg(aps[i + 1], aps[i], ac);
      if (back != null) cands.push({ source: r.source, from: aps[i + 1], to: aps[i], reversed: true, score: back + 5 });
    }
  }
  if (!cands.length) {
    const first = info.routes.find(r => r.airports?.length >= 2);
    return first ? { status: "unconfirmed", from: first.airports[0], to: first.airports[first.airports.length - 1] } : null;
  }
  cands.sort((x, y) => x.score - y.score);
  const best = cands[0];
  const key = c => (c.from.icao || c.from.iata) + ">" + (c.to.icao || c.to.iata);
  const sources = [...new Set(cands.filter(c => key(c) === key(best)).map(c => c.source))];
  return { status: "confirmed", from: best.from, to: best.to, reversed: best.reversed, sources };
}

// ---- Aircraft / route details (looked up when you tap a plane) ----
// infoCache values: {aircraft, airline, routes} | "none" | "error"; undefined = not requested yet.
const infoCache = new Map();
const infoPending = new Set();
const infoKey = ac => ac.hex + "|" + (ac.flight || "").trim();

async function loadInfo(ac) {
  const key = infoKey(ac);
  const cached = infoCache.get(key);
  if (infoPending.has(key) || (cached && cached !== "error")) return;
  if (!/^[0-9a-f]{6}$/i.test(ac.hex)) { infoCache.set(key, "none"); return; }   // e.g. TIS-B targets
  infoPending.add(key);
  try {
    const cs = (ac.flight || "").trim();
    const q = cs ? `?callsign=${encodeURIComponent(cs)}` : "";
    const res = await fetch(`${PROXY_URL}/api/info/${ac.hex}${q}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    infoCache.set(key, json.aircraft || json.routes?.length ? json : "none");
  } catch (e) {
    infoCache.set(key, "error");
  } finally {
    infoPending.delete(key);
  }
}

function popupHtml(ac) {
  const callsign = (ac.flight || "").trim();
  const info = infoCache.get(infoKey(ac));
  const ready = info && typeof info === "object";
  const am = ready ? info.aircraft : null;
  const rt = ready ? routeFor(ac, info) : null;
  const row = (k, v) => v == null || v === "" ? "" : `<div class="row"><span>${k}</span><span>${esc(v)}</span></div>`;
  const rowAlways = (k, v) => `<div class="row"><span>${k}</span><span>${esc(v ?? "–")}</span></div>`;
  const code = a => a.iata || a.icao || "?";
  const place = a => a.city || a.name || "";

  let routeBlock = "";
  let toGo = null;
  if (rt?.status === "confirmed") {
    const d = rt.to;
    const note = [
      `Fits the plane's position (${rt.sources.join(" + ")})`,
      rt.reversed ? "Direction worked out from its heading" : "",
    ].filter(Boolean).join(". ");
    routeBlock = `
      <div class="route">
        <div class="codes"><span>${esc(code(rt.from))}</span><span class="arrow">✈</span><span>${esc(code(d))}</span></div>
        <div class="cities"><span>${esc(place(rt.from))}</span><span>${esc(place(d))}</span></div>
        <div class="note">${esc(note)}</div>
      </div>`;
    if (d.lat != null && ac.alt_baro !== "ground" && ac.gs > 50) {
      const nm = distNm(ac.lat, ac.lon, d.lat, d.lon);
      toGo = `${Math.round(nm).toLocaleString()} nm · ~${fmtDur(nm / ac.gs * 60)}`;
    }
  } else if (rt?.status === "unconfirmed") {
    routeBlock = `
      <div class="route unconfirmed">
        <div class="codes"><span>${esc(code(rt.from))}</span><span class="arrow">?</span><span>${esc(code(rt.to))}</span></div>
        <div class="note">Route unconfirmed: the database lists this, but the plane's position and heading don't fit it.</div>
      </div>`;
  } else if (info === undefined) {
    routeBlock = `<div class="muted">Looking up route…</div>`;
  } else if (info === "error") {
    routeBlock = `<div class="muted">Route lookup failed. Tap the plane again to retry.</div>`;
  } else if (callsign) {
    routeBlock = `<div class="muted">No route on file for ${esc(callsign)}</div>`;
  }

  const model = am ? [am.manufacturer, am.type].filter(Boolean).join(" ") : "";
  const aircraftName = model || ac.desc || ac.t;

  return `
    <b>${esc(callsign || "No callsign")}</b>
    ${ready && info.airline ? `<div class="airline">${esc(info.airline)}</div>` : ""}
    ${routeBlock}
    ${row("To go (approx.)", toGo)}
    ${rowAlways("Aircraft", aircraftName)}
    ${row("Type code", ac.t)}
    ${row("Reg", ac.r || am?.registration)}
    ${row("Owner", am?.registered_owner)}
    ${row("Registered in", am?.registered_owner_country_name)}
    ${row("Built", ac.year)}
    ${rowAlways("Altitude", fmtAlt(ac.alt_baro))}
    ${rowAlways("Speed", ac.gs != null ? Math.round(ac.gs) + " kt" : null)}
    ${rowAlways("Heading", ac.track != null ? Math.round(ac.track) + "°" : null)}
    ${row("Vert. rate", ac.baro_rate != null ? ac.baro_rate + " ft/min" : null)}
    ${row("Squawk", ac.squawk)}
    ${row("ICAO hex", ac.hex)}`;
}

// Dashed line origin → plane → destination for the selected aircraft
let routeGeom = null;   // { line, layer, from: [lat, lon], to: [lat, lon] }
function clearRoute() {
  if (routeGeom) { map.removeLayer(routeGeom.layer); routeGeom = null; }
}
function drawRoute(entry) {
  clearRoute();
  const ac = entry.data;
  const info = infoCache.get(infoKey(ac));
  const rt = info && typeof info === "object" ? routeFor(ac, info) : null;
  if (rt?.status !== "confirmed" || rt.from.lat == null || rt.to.lat == null) return;
  const from = [rt.from.lat, rt.from.lon], to = [rt.to.lat, rt.to.lon];
  const line = L.polyline([from, [entry.disp.lat, entry.disp.lon], to],
    { color: "#63b3ff", weight: 2, opacity: .8, dashArray: "6 6" });
  const layer = L.layerGroup([
    line,
    L.circleMarker(from, { radius: 5, color: "#fff", weight: 2, fillColor: "#63b3ff", fillOpacity: 1 })
      .bindTooltip(esc(rt.from.iata || rt.from.icao || ""), { permanent: true, direction: "top", className: "apt-tip" }),
    L.circleMarker(to, { radius: 5, color: "#fff", weight: 2, fillColor: "#ff6b6b", fillOpacity: 1 })
      .bindTooltip(esc(rt.to.iata || rt.to.icao || ""), { permanent: true, direction: "top", className: "apt-tip" }),
  ]).addTo(map);
  routeGeom = { line, layer, from, to };
}

async function openPlane(entry) {
  selectedHex = entry.data.hex;
  await loadInfo(entry.data);
  const current = aircraft.get(entry.data.hex);
  if (current && current.marker.isPopupOpen()) {
    current.marker.getPopup().setContent(popupHtml(current.data));
    drawRoute(current);
  }
}

// ---- Smooth movement ----
// Each plane reports position, speed and heading a few seconds apart. Between reports we
// predict where it is from speed and heading (dead reckoning), and when a fresh report
// disagrees with the prediction the difference is eased out instead of snapping.
function project(rep, now) {
  if (rep.ground || rep.gs == null || rep.track == null || rep.gs < 5) return { lat: rep.lat, lon: rep.lon };
  const dt = Math.min(Math.max((now - rep.t) / 1000, 0), MAX_EXTRAP_S);
  const nm = rep.gs * dt / 3600;
  const lat = rep.lat + nm * Math.cos(rep.track * RAD) / 60;
  const lon = rep.lon + nm * Math.sin(rep.track * RAD) / (60 * Math.cos(rep.lat * RAD));
  return { lat, lon };
}

function makeRep(ac, snapT) {
  return {
    lat: ac.lat, lon: ac.lon, gs: ac.gs, track: ac.track,
    ground: ac.alt_baro === "ground",
    t: snapT - (ac.seen_pos ?? 0) * 1000,       // when the position was actually measured
  };
}

function makeEntry(ac, rep) {
  const marker = L.marker([ac.lat, ac.lon], { icon: planeIcon(ac) }).addTo(map);
  const el = marker.getElement();
  const entry = {
    marker, data: ac, rep,
    off: { lat: 0, lon: 0 }, offT: 0,                       // correction being eased out
    disp: { lat: ac.lat, lon: ac.lon, hdg: ac.track ?? 0 }, // where the plane should be right now
    drawn: { lat: ac.lat, lon: ac.lon, hdg: ac.track ?? 0 },// what was last actually written to the screen
    els: { plane: el.querySelector(".plane"), path: el.querySelector("path"), label: el.querySelector(".label") },
    colour: altColour(ac.alt_baro), labelText: labelFor(ac),
    lastSeen: Date.now(),
    points: [[ac.lat, ac.lon]],
    trail: L.polyline([[ac.lat, ac.lon]], { weight: 2, opacity: 0.5, color: altColour(ac.alt_baro) }).addTo(map),
  };
  entry.els.plane.style.transform = `rotate(${entry.disp.hdg}deg)`;
  marker.bindPopup(() => popupHtml(entry.data), { minWidth: 230, maxWidth: 300 });
  marker.on("popupopen", () => openPlane(entry));
  marker.on("popupclose", () => { selectedHex = null; clearRoute(); });
  return entry;
}

let lastFrame = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (document.hidden || zooming || ts - lastFrame < FRAME_MS) return;
  const dt = ts - lastFrame;
  lastFrame = ts;
  const now = Date.now();
  const v = map.getBounds().pad(0.3);
  const south = v.getSouth(), north = v.getNorth(), west = v.getWest(), east = v.getEast();
  // Size of half a screen pixel in degrees at this zoom. Planes that haven't moved that far
  // are left alone, which saves almost all the work when zoomed out over a busy sky.
  const pxLon = 360 / (256 * 2 ** map.getZoom()) * 0.5;

  for (const entry of aircraft.values()) {
    const p = project(entry.rep, now);
    const k = Math.exp(-(now - entry.offT) / (BLEND_MS / 2.5));
    const lat = p.lat + entry.off.lat * k;
    const lon = p.lon + entry.off.lon * k;

    // ease the nose towards the reported heading by the short way round
    const target = entry.rep.track;
    if (target != null) {
      const diff = ((target - entry.disp.hdg + 540) % 360) - 180;
      entry.disp.hdg = (entry.disp.hdg + diff * (1 - Math.exp(-dt / 350)) + 360) % 360;
    }
    entry.disp.lat = lat;
    entry.disp.lon = lon;

    const selected = entry.data.hex === selectedHex;
    if (!selected && (lat < south || lat > north || lon < west || lon > east)) continue;   // off screen

    const d = entry.drawn;
    if (selected || Math.abs(lon - d.lon) >= pxLon || Math.abs(lat - d.lat) >= pxLon * Math.cos(lat * RAD)) {
      entry.marker.setLatLng({ lat, lng: lon });
      d.lat = lat; d.lon = lon;
    }
    if (Math.abs(entry.disp.hdg - d.hdg) >= 0.4) {
      entry.els.plane.style.transform = `rotate(${entry.disp.hdg.toFixed(1)}deg)`;
      d.hdg = entry.disp.hdg;
    }

    if (selected) {
      entry.trail.setLatLngs([...entry.points, [lat, lon]]);
      if (routeGeom) routeGeom.line.setLatLngs([routeGeom.from, [lat, lon], routeGeom.to]);
    }
  }
}
requestAnimationFrame(frame);

// ---- Fetch + draw ----
function viewRadiusNm() {
  const c = map.getCenter();
  const corner = map.getBounds().getNorthEast();
  const nm = map.distance(c, corner) / 1852;
  return Math.min(MAX_RADIUS_NM, Math.max(10, Math.ceil(nm)));
}

let inFlight = false;
async function refresh() {
  if (inFlight || document.hidden) return;
  inFlight = true;
  try {
    const c = map.getCenter();
    const r = viewRadiusNm();
    const lat = c.lat.toFixed(4), lon = c.lng.toFixed(4);
    const res = await fetch(`${PROXY_URL}/api/lat/${lat}/lon/${lon}/dist/${r}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();

    // When the feed took its snapshot. Trust it only if this device's clock agrees (within a minute).
    let snapT = Date.now();
    let n = Number(json.now);
    if (n && n < 1e11) n *= 1000;
    if (n && Math.abs(Date.now() - n) < 60000) snapT = n;

    const list = (json.ac || json.aircraft || []).filter(a => a.lat != null && a.lon != null);
    draw(list, snapT);
    const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    statusEl.textContent = `${list.length} aircraft · ${t}`;
  } catch (e) {
    statusEl.textContent = "Feed error: " + e.message;
  } finally {
    inFlight = false;
  }
}

function draw(list, snapT) {
  const now = Date.now();
  const seen = new Set();
  for (const ac of list) {
    seen.add(ac.hex);
    const rep = makeRep(ac, snapT);
    let entry = aircraft.get(ac.hex);
    if (!entry) {
      aircraft.set(ac.hex, makeEntry(ac, rep));
      continue;
    }
    entry.lastSeen = now;
    if (rep.t < entry.rep.t) continue;                       // an older snapshot arrived late: ignore it

    // Keep the on-screen position continuous: remember how far the prediction was off, then fade it out
    const target = project(rep, now);
    const gapLat = entry.disp.lat - target.lat, gapLon = entry.disp.lon - target.lon;
    const gapNm = Math.hypot(gapLat * 60, gapLon * 60 * Math.cos(target.lat * RAD));
    entry.off = gapNm > 3 ? { lat: 0, lon: 0 } : { lat: gapLat, lon: gapLon };   // big jumps just snap
    entry.offT = now;
    entry.rep = rep;
    entry.data = ac;

    const last = entry.points[entry.points.length - 1];
    if (last[0] !== ac.lat || last[1] !== ac.lon) {
      entry.points.push([ac.lat, ac.lon]);
      if (entry.points.length > TRAIL_POINTS) entry.points.shift();
      entry.trail.setLatLngs(entry.points);
    }

    const colour = altColour(ac.alt_baro);
    if (colour !== entry.colour) {
      entry.colour = colour;
      entry.els.path.setAttribute("fill", colour);
      entry.trail.setStyle({ color: colour });
    }
    const label = labelFor(ac);
    if (label !== entry.labelText) {
      entry.labelText = label;
      entry.els.label.textContent = label;
    }

    if (entry.marker.isPopupOpen()) {
      entry.marker.getPopup().setContent(popupHtml(ac));
      drawRoute(entry);
    }
  }

  // Drop planes the feed no longer reports, after a short grace period for brief dropouts
  for (const [hex, entry] of aircraft) {
    if (!seen.has(hex) && now - entry.lastSeen > KEEP_MISSING_MS) {
      map.removeLayer(entry.marker);
      map.removeLayer(entry.trail);
      if (selectedHex === hex) { selectedHex = null; clearRoute(); }
      aircraft.delete(hex);
    }
  }
}

// ---- Location ----
function locate(initial) {
  if (!navigator.geolocation) { refresh(); return; }
  statusEl.textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    map.setView(ll, 10);
    if (youMarker) youMarker.setLatLng(ll);
    else youMarker = L.circleMarker(ll, { radius: 6, color: "#fff", weight: 2, fillColor: "#3b82f6", fillOpacity: 1 }).addTo(map);
    refresh();
  }, () => {
    statusEl.textContent = initial ? "Location off, using default" : "Couldn't get location";
    refresh();
  }, { enableHighAccuracy: false, timeout: 8000 });
}

document.getElementById("locate").addEventListener("click", () => locate(false));
let moveTimer;
map.on("moveend", () => { clearTimeout(moveTimer); moveTimer = setTimeout(refresh, 700); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

locate(true);
setInterval(refresh, POLL_MS);
</script>
</body>
