<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1720">
<meta name="apple-mobile-web-app-title" content="Overhead">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>Overhead</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body {
    margin: 0; height: 100%; background: #0f1720; font-family: system-ui, -apple-system, sans-serif;
    overscroll-behavior: none;                 /* no rubber-band bounce when installed */
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  #map { position: absolute; inset: 0; background: #1b1f24; }
  /* Keep controls clear of the iPhone notch, Dynamic Island and home indicator */
  .leaflet-bottom { padding-bottom: env(safe-area-inset-bottom); }
  .leaflet-left   { padding-left: env(safe-area-inset-left); }
  .leaflet-right  { padding-right: env(safe-area-inset-right); }
  /* Turn the standard OSM tiles into a dark map (set to "none" for a light map) */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.7); }
  .bar {
    position: absolute; z-index: 1000;
    left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right));
    top: calc(env(safe-area-inset-top) + 10px);
    display: flex; gap: 8px; align-items: center; justify-content: space-between;
    pointer-events: none;
  }
  .pill {
    pointer-events: auto; background: rgba(15,23,32,.88); color: #e6edf3;
    padding: 8px 12px; border-radius: 999px; font-size: 13px;
    border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px);
  }
  button.pill { font: inherit; font-size: 13px; cursor: pointer; }
  .plane { will-change: transform; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  .plane svg { display: block; }
  .label {
    position: absolute; left: 20px; top: -2px; white-space: nowrap;
    font-size: 11px; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000;
    pointer-events: none;
  }
  .leaflet-popup-content {
    margin: 10px 12px; font-size: 13px; line-height: 1.5;
    max-height: calc(100vh - 200px); max-height: calc(100dvh - 200px);   /* tall cards scroll instead of running off a small screen */
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .leaflet-popup-content b { font-size: 15px; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .row span:first-child { color: #667; }
  .row span:last-child { text-align: right; }
  .muted { color: #889; font-size: 12px; margin: 4px 0; }
  .airline { font-size: 12px; color: #667; margin-bottom: 2px; }
  .route { margin: 6px 0 4px; padding: 8px 10px; border-radius: 8px; background: rgba(120,140,170,.15); }
  .route.unconfirmed { background: rgba(200,160,60,.14); }
  .route .codes { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .route .arrow { flex: 1; text-align: center; color: #889; font-weight: 400; }
  .route .cities { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: #667; margin-top: 2px; }
  .route .cities span:last-child { text-align: right; }
  .route .note { font-size: 11px; color: #667; margin-top: 4px; }
  .apt-tip { font-weight: 700; }

  [hidden] { display: none !important; }
  #status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btns { display: flex; gap: 8px; flex: none; }
  button.icon { width: 44px; height: 36px; padding: 0; font-size: 17px; line-height: 1; }

  /* Search */
  #search {
    position: absolute; z-index: 1100;
    left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right));
    top: calc(env(safe-area-inset-top) + 58px);
    max-height: 62vh; display: flex; flex-direction: column;
    background: rgba(15,23,32,.96); color: #e6edf3; padding: 10px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(8px);
  }
  #searchForm { display: flex; gap: 8px; }
  #q {
    flex: 1; min-width: 0; font: inherit; font-size: 16px;      /* 16px stops iOS zooming in on focus */
    padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18);
    background: #0b1118; color: #e6edf3;
  }
  #searchForm button {
    font: inherit; font-size: 15px; border-radius: 10px; padding: 0 14px;
    border: 1px solid rgba(255,255,255,.18); background: #1c2b3a; color: #e6edf3; cursor: pointer;
  }
  #results { overflow-y: auto; margin-top: 8px; -webkit-overflow-scrolling: touch; }
  .res {
    display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    border-top: 1px solid rgba(255,255,255,.08); color: inherit; padding: 9px 4px; font: inherit;
  }
  .res .r1 b { font-size: 15px; }
  .res .r1 i { color: #8fb4d8; font-style: normal; margin-left: 8px; font-size: 12px; }
  .res .r2 { display: block; font-size: 12px; color: #93a1b0; margin-top: 1px; }
  .hint { font-size: 12.5px; color: #93a1b0; padding: 8px 4px; line-height: 1.45; }

  /* Your photos (inside the popup) */
  .pop-photos { margin-bottom: 6px; }
  .pop-photos:empty { display: none; }
  .pop-photos .hero { display: block; width: 100%; height: 120px; object-fit: cover; border-radius: 8px; cursor: pointer; background: #dde3ea; }
  .thumbs { display: flex; gap: 6px; overflow-x: auto; padding: 6px 0 2px; -webkit-overflow-scrolling: touch; }
  .thumbs img, .thumbs button { flex: none; width: 48px; height: 48px; border-radius: 6px; object-fit: cover; cursor: pointer; }
  .thumbs button, .addphoto { border: 1px dashed #9aa5b1; background: rgba(120,140,170,.12); color: #556; font: inherit; }
  .thumbs button { font-size: 20px; }
  .addphoto { padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }

  #lightbox {
    position: fixed; inset: 0; z-index: 3000; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  #lbImg { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb-top, .lb-bottom {
    position: absolute; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 10px 14px; color: #e6edf3; font-size: 13px;
  }
  .lb-top { top: env(safe-area-inset-top); background: linear-gradient(rgba(0,0,0,.6), transparent); }
  .lb-bottom { bottom: env(safe-area-inset-bottom); background: linear-gradient(transparent, rgba(0,0,0,.6)); }
  .lb-top button, .lb-bottom button {
    font: inherit; font-size: 15px; color: #e6edf3; background: rgba(255,255,255,.14); border: 0;
    border-radius: 10px; padding: 9px 14px; cursor: pointer;
  }
  .lb-bottom .del { color: #ff9a9a; }

  #toast {
    position: fixed; z-index: 4000; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 70px); max-width: 86vw; text-align: center;
    background: rgba(15,23,32,.95); color: #e6edf3; font-size: 13px; padding: 9px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.14);
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <div class="pill" id="status">Starting…</div>
  <div class="btns">
    <button class="pill icon" id="searchBtn" aria-label="Search flights">🔍</button>
    <button class="pill icon" id="locate" aria-label="Locate me">📍</button>
  </div>
</div>

<div id="search" hidden>
  <form id="searchForm" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" autocapitalize="characters" autocorrect="off"
           spellcheck="false" placeholder="BA117, BAW117, G-XWBA, A388…">
    <button type="submit">Go</button>
    <button type="button" id="searchClose" aria-label="Close search">✕</button>
  </form>
  <div id="results"></div>
</div>

<input type="file" id="photoInput" accept="image/*" multiple hidden>

<div id="lightbox" hidden>
  <img id="lbImg" alt="">
  <div class="lb-top"><span id="lbCap"></span><button type="button" id="lbClose" aria-label="Close">✕</button></div>
  <div class="lb-bottom">
    <button type="button" id="lbPrev" aria-label="Previous">‹</button>
    <button type="button" id="lbDel" class="del">Delete</button>
    <span id="lbCount"></span>
    <button type="button" id="lbNext" aria-label="Next">›</button>
  </div>
</div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- Settings you may want to tweak ----
// Leave empty when this page is served by the same Cloudflare Worker as the API.
const PROXY_URL = "";
const POLL_MS = 6000;               // how often to ask the feed for new positions
const MAX_RADIUS_NM = 250;
const TRAIL_POINTS = 25;
const DEFAULT_CENTER = [53.7938, -1.7564];          // fallback if location is denied
const DEFAULT_ZOOM = 9;

// Smooth movement
const FRAME_MS = 33;                // redraw roughly 30 times a second
const BLEND_MS = 1200;              // new data is eased in over about this long instead of snapping
const MAX_EXTRAP_S = 25;            // stop predicting if a plane's data is older than this
const KEEP_MISSING_MS = 15000;      // keep a plane on screen this long if the feed briefly drops it
const RAD = Math.PI / 180;

// ---- Remembered view ----
// Storage can be empty or blocked (private windows etc.), so every access is guarded.
function loadSaved(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ } }
const saved = loadSaved("overhead.view");
const validSaved = saved && Math.abs(saved.lat) <= 90 && Math.abs(saved.lng) <= 180 && saved.zoom >= 3 && saved.zoom <= 18;

// ---- Map ----
const map = L.map("map", { zoomControl: false, attributionControl: true })
  .setView(validSaved ? [saved.lat, saved.lng] : DEFAULT_CENTER, validSaved ? saved.zoom : DEFAULT_ZOOM);
map.on("moveend", () => {
  const c = map.getCenter();
  save("overhead.view", { lat: c.lat, lng: c.lng, zoom: map.getZoom() });
});

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

L.control.zoom({ position: "bottomright" }).addTo(map);

const statusEl = document.getElementById("status");
const aircraft = new Map();   // hex -> entry (see makeEntry)
let youMarker = null;
let selectedHex = null;
let zooming = false;
map.on("zoomstart", () => { zooming = true; });
map.on("zoomend", () => { zooming = false; });

// ---- Helpers ----
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function altColour(alt) {
  if (alt === "ground" || alt == null) return "#9aa5b1";
  if (alt < 2000)  return "#ff6b6b";
  if (alt < 10000) return "#ffb347";
  if (alt < 25000) return "#f4e04d";
  if (alt < 35000) return "#4fd1c5";
  return "#63b3ff";
}

const labelFor = ac => (ac.flight || "").trim() || ac.r || ac.hex;

function planeIcon(ac) {
  return L.divIcon({
    className: "",
    iconSize: [24, 24],
    iconAnchor: [12, 12],
    popupAnchor: [0, -10],
    html: `
      <div class="plane">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path fill="${altColour(ac.alt_baro)}" stroke="#0f1720" stroke-width="1"
            d="M12 1.5c.9 0 1.5.8 1.5 1.8v6.2l8 4.6v2.2l-8-2.3v4.6l2.3 1.7V22L12 20.7 8.2 22v-1.7l2.3-1.7v-4.6l-8 2.3v-2.2l8-4.6V3.3c0-1 .6-1.8 1.5-1.8z"/>
        </svg>
      </div>
      <div class="label">${esc(labelFor(ac))}</div>`
  });
}

function fmtAlt(a) {
  if (a === "ground") return "On ground";
  if (a == null) return "–";
  return a >= 18000 ? `FL${Math.round(a / 100)}` : `${a.toLocaleString()} ft`;
}

// ---- Geometry ----
const R_NM = 3440.065;

function distNm(lat1, lon1, lat2, lon2) {
  const dLat = (lat2 - lat1) * RAD, dLon = (lon2 - lon1) * RAD;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * RAD) * Math.cos(lat2 * RAD) * Math.sin(dLon / 2) ** 2;
  return 2 * R_NM * Math.asin(Math.sqrt(x));
}

function bearing(lat1, lon1, lat2, lon2) {
  const p1 = lat1 * RAD, p2 = lat2 * RAD, dl = (lon2 - lon1) * RAD;
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) / RAD + 360) % 360;
}

const angDiff = (a, b) => Math.abs(((a - b + 540) % 360) - 180);

function fmtDur(min) {
  if (min < 1) return "<1 min";
  return min < 60 ? `${Math.round(min)} min` : `${Math.floor(min / 60)} h ${Math.round(min % 60)} min`;
}

// ---- Route checking ----
// Route databases keep one entry per callsign, but a callsign can fly several legs and
// entries go stale. So every candidate leg is tested against where the plane really is.
// Returns a score (lower = better fit) or null if the plane can't plausibly be on this leg.
function fitLeg(a, b, ac) {
  if (a?.lat == null || a?.lon == null || b?.lat == null || b?.lon == null) return null;
  const len = distNm(a.lat, a.lon, b.lat, b.lon);
  if (len < 5) return null;
  const toA = distNm(a.lat, a.lon, ac.lat, ac.lon);
  const toB = distNm(b.lat, b.lon, ac.lat, ac.lon);
  const nearEnd = Math.min(toA, toB);

  // Parked or taxiing: only plausible if it is at one of the two airports
  if (ac.alt_baro === "ground") return nearEnd < 15 ? nearEnd : null;

  // How far off the straight line between the airports, and how far along it
  const d13 = toA / R_NM;
  const t13 = bearing(a.lat, a.lon, ac.lat, ac.lon) * RAD;
  const t12 = bearing(a.lat, a.lon, b.lat, b.lon) * RAD;
  const xt = Math.asin(Math.sin(d13) * Math.sin(t13 - t12)) * R_NM;
  let along = Math.acos(Math.max(-1, Math.min(1, Math.cos(d13) / Math.cos(xt / R_NM)))) * R_NM;
  if (Math.cos(t13 - t12) < 0) along = -along;

  // The corridor is narrow near the airports and widens towards mid-route (long oceanic
  // flights can sit a couple of hundred miles off the straight line), but never beyond 250 nm.
  if (Math.abs(xt) > Math.min(250, 40 + 0.25 * nearEnd)) return null;
  if (along < -50 || along > len + 50) return null;             // outside the two airports

  let headingPenalty = 0;
  if (nearEnd > 40 && ac.track != null) {                       // near an airport planes turn, so skip
    const diff = angDiff(ac.track, bearing(ac.lat, ac.lon, b.lat, b.lon));
    if (diff > 90) return null;                                 // heading away from the destination
    headingPenalty = diff / 180 * 20;
  }
  return Math.abs(xt) + headingPenalty;
}

// Picks the best leg across all candidate routes, or reports that none fits.
function routeFor(ac, info) {
  if (!info || typeof info !== "object" || !info.routes?.length) return null;
  const cands = [];
  for (const r of info.routes) {
    const aps = r.airports || [];
    for (let i = 0; i + 1 < aps.length; i++) {
      const forward = fitLeg(aps[i], aps[i + 1], ac);
      if (forward != null) cands.push({ source: r.source, from: aps[i], to: aps[i + 1], reversed: false, score: forward });
      const back = fitLeg(aps[i + 1], aps[i], ac);
      if (back != null) cands.push({ source: r.source, from: aps[i + 1], to: aps[i], reversed: true, score: back + 5 });
    }
  }
  if (!cands.length) {
    const first = info.routes.find(r => r.airports?.length >= 2);
    return first ? { status: "unconfirmed", from: first.airports[0], to: first.airports[first.airports.length - 1] } : null;
  }
  cands.sort((x, y) => x.score - y.score);
  const best = cands[0];
  const key = c => (c.from.icao || c.from.iata) + ">" + (c.to.icao || c.to.iata);
  const sources = [...new Set(cands.filter(c => key(c) === key(best)).map(c => c.source))];
  return { status: "confirmed", from: best.from, to: best.to, reversed: best.reversed, sources };
}

// ---- Aircraft / route details (looked up when you tap a plane) ----
// infoCache values: {aircraft, airline, routes} | "none" | "error"; undefined = not requested yet.
const infoCache = new Map();
const infoPending = new Set();
const infoKey = ac => ac.hex + "|" + (ac.flight || "").trim();

async function loadInfo(ac) {
  const key = infoKey(ac);
  const cached = infoCache.get(key);
  if (infoPending.has(key) || (cached && cached !== "error")) return;
  if (!/^[0-9a-f]{6}$/i.test(ac.hex)) { infoCache.set(key, "none"); return; }   // e.g. TIS-B targets
  infoPending.add(key);
  try {
    const cs = (ac.flight || "").trim();
    const q = cs ? `?callsign=${encodeURIComponent(cs)}` : "";
    const res = await fetch(`${PROXY_URL}/api/info/${ac.hex}${q}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    infoCache.set(key, json.aircraft || json.routes?.length ? json : "none");
  } catch (e) {
    infoCache.set(key, "error");
  } finally {
    infoPending.delete(key);
  }
}

function popupHtml(ac) {
  const callsign = (ac.flight || "").trim();
  const info = infoCache.get(infoKey(ac));
  const ready = info && typeof info === "object";
  const am = ready ? info.aircraft : null;
  const rt = ready ? routeFor(ac, info) : null;
  const row = (k, v) => v == null || v === "" ? "" : `<div class="row"><span>${k}</span><span>${esc(v)}</span></div>`;
  const rowAlways = (k, v) => `<div class="row"><span>${k}</span><span>${esc(v ?? "–")}</span></div>`;
  const code = a => a.iata || a.icao || "?";
  const place = a => a.city || a.name || "";

  let routeBlock = "";
  let toGo = null;
  if (rt?.status === "confirmed") {
    const d = rt.to;
    const note = [
      `Fits the plane's position (${rt.sources.join(" + ")})`,
      rt.reversed ? "Direction worked out from its heading" : "",
    ].filter(Boolean).join(". ");
    routeBlock = `
      <div class="route">
        <div class="codes"><span>${esc(code(rt.from))}</span><span class="arrow">✈</span><span>${esc(code(d))}</span></div>
        <div class="cities"><span>${esc(place(rt.from))}</span><span>${esc(place(d))}</span></div>
        <div class="note">${esc(note)}</div>
      </div>`;
    if (d.lat != null && ac.alt_baro !== "ground" && ac.gs > 50) {
      const nm = distNm(ac.lat, ac.lon, d.lat, d.lon);
      toGo = `${Math.round(nm).toLocaleString()} nm · ~${fmtDur(nm / ac.gs * 60)}`;
    }
  } else if (rt?.status === "unconfirmed") {
    routeBlock = `
      <div class="route unconfirmed">
        <div class="codes"><span>${esc(code(rt.from))}</span><span class="arrow">?</span><span>${esc(code(rt.to))}</span></div>
        <div class="note">Route unconfirmed: the database lists this, but the plane's position and heading don't fit it.</div>
      </div>`;
  } else if (info === undefined) {
    routeBlock = `<div class="muted">Looking up route…</div>`;
  } else if (info === "error") {
    routeBlock = `<div class="muted">Route lookup failed. Tap the plane again to retry.</div>`;
  } else if (callsign) {
    routeBlock = `<div class="muted">No route on file for ${esc(callsign)}</div>`;
  }

  const model = am ? [am.manufacturer, am.type].filter(Boolean).join(" ") : "";
  const aircraftName = model || ac.desc || ac.t;

  return `
    <b>${esc(callsign || "No callsign")}</b>
    ${ready && info.airline ? `<div class="airline">${esc(info.airline)}</div>` : ""}
    ${routeBlock}
    ${row("To go (approx.)", toGo)}
    ${rowAlways("Aircraft", aircraftName)}
    ${row("Type code", ac.t)}
    ${row("Reg", ac.r || am?.registration)}
    ${row("Owner", am?.registered_owner)}
    ${row("Registered in", am?.registered_owner_country_name)}
    ${row("Built", ac.year)}
    ${rowAlways("Altitude", fmtAlt(ac.alt_baro))}
    ${rowAlways("Speed", ac.gs != null ? Math.round(ac.gs) + " kt" : null)}
    ${rowAlways("Heading", ac.track != null ? Math.round(ac.track) + "°" : null)}
    ${row("Vert. rate", ac.baro_rate != null ? ac.baro_rate + " ft/min" : null)}
    ${row("Squawk", ac.squawk)}
    ${row("ICAO hex", ac.hex)}`;
}

// Dashed line origin → plane → destination for the selected aircraft
let routeGeom = null;   // { line, layer, from: [lat, lon], to: [lat, lon] }
function clearRoute() {
  if (routeGeom) { map.removeLayer(routeGeom.layer); routeGeom = null; }
}
function drawRoute(entry) {
  clearRoute();
  const ac = entry.data;
  const info = infoCache.get(infoKey(ac));
  const rt = info && typeof info === "object" ? routeFor(ac, info) : null;
  if (rt?.status !== "confirmed" || rt.from.lat == null || rt.to.lat == null) return;
  const from = [rt.from.lat, rt.from.lon], to = [rt.to.lat, rt.to.lon];
  const line = L.polyline([from, [entry.disp.lat, entry.disp.lon], to],
    { color: "#63b3ff", weight: 2, opacity: .8, dashArray: "6 6" });
  const layer = L.layerGroup([
    line,
    L.circleMarker(from, { radius: 5, color: "#fff", weight: 2, fillColor: "#63b3ff", fillOpacity: 1 })
      .bindTooltip(esc(rt.from.iata || rt.from.icao || ""), { permanent: true, direction: "top", className: "apt-tip" }),
    L.circleMarker(to, { radius: 5, color: "#fff", weight: 2, fillColor: "#ff6b6b", fillOpacity: 1 })
      .bindTooltip(esc(rt.to.iata || rt.to.icao || ""), { permanent: true, direction: "top", className: "apt-tip" }),
  ]).addTo(map);
  routeGeom = { line, layer, from, to };
}

// The popup is built once per plane. Only its text part is rewritten when data changes, so the
// photo section (and any file picker you have open) is never torn down by a refresh.
function refreshPopup(entry) {
  if (!entry.marker.isPopupOpen()) return;
  const el = entry.marker.getPopup().getElement();
  const before = el.offsetHeight;
  entry.popupEl.querySelector(".pop-info").innerHTML = popupHtml(entry.data);
  if (el.offsetHeight !== before) keepPopupInView(entry);
}

// Leaflet's built-in auto-pan is switched off for these popups: it re-checks on every movement of
// the plane, and a tall popup never quite fits, so it kept nudging the map (and re-attaching the
// popup's content, which resets the photo strip and can swallow taps). Instead the map is moved
// once, when the popup opens or changes height, just enough to bring it fully into view.
function keepPopupInView(entry) {
  const popup = entry.marker.getPopup();
  const el = popup && popup.getElement();
  if (!el || !entry.marker.isPopupOpen()) return;
  const r = el.getBoundingClientRect();
  const m = map.getContainer().getBoundingClientRect();
  const topLimit = document.querySelector(".bar").getBoundingClientRect().bottom + 10;   // keep clear of the top buttons
  const pad = 10;
  let dx = 0, dy = 0;
  if (r.top < topLimit) dy = r.top - topLimit;
  if (r.right > m.right - pad) dx = r.right - (m.right - pad);
  if (r.left < m.left + pad) dx = r.left - (m.left + pad);
  if (Math.abs(dx) > 1 || Math.abs(dy) > 1) map.panBy([dx, dy], { animate: true, duration: 0.25 });
}

async function openPlane(entry) {
  selectedHex = entry.data.hex;
  refreshPopup(entry);
  renderPhotos(entry);
  await loadInfo(entry.data);
  const current = aircraft.get(entry.data.hex);
  if (current && current.marker.isPopupOpen()) {
    refreshPopup(current);
    drawRoute(current);
  }
}

// ---- Smooth movement ----
// Each plane reports position, speed and heading a few seconds apart. Between reports we
// predict where it is from speed and heading (dead reckoning), and when a fresh report
// disagrees with the prediction the difference is eased out instead of snapping.
function project(rep, now) {
  if (rep.ground || rep.gs == null || rep.track == null || rep.gs < 5) return { lat: rep.lat, lon: rep.lon };
  const dt = Math.min(Math.max((now - rep.t) / 1000, 0), MAX_EXTRAP_S);
  const nm = rep.gs * dt / 3600;
  const lat = rep.lat + nm * Math.cos(rep.track * RAD) / 60;
  const lon = rep.lon + nm * Math.sin(rep.track * RAD) / (60 * Math.cos(rep.lat * RAD));
  return { lat, lon };
}

function makeRep(ac, snapT) {
  return {
    lat: ac.lat, lon: ac.lon, gs: ac.gs, track: ac.track,
    ground: ac.alt_baro === "ground",
    t: snapT - (ac.seen_pos ?? 0) * 1000,       // when the position was actually measured
  };
}

function makeEntry(ac, rep) {
  const marker = L.marker([ac.lat, ac.lon], { icon: planeIcon(ac) }).addTo(map);
  const el = marker.getElement();
  const entry = {
    marker, data: ac, rep,
    off: { lat: 0, lon: 0 }, offT: 0,                       // correction being eased out
    disp: { lat: ac.lat, lon: ac.lon, hdg: ac.track ?? 0 }, // where the plane should be right now
    drawn: { lat: ac.lat, lon: ac.lon, hdg: ac.track ?? 0 },// what was last actually written to the screen
    els: { plane: el.querySelector(".plane"), path: el.querySelector("path"), label: el.querySelector(".label") },
    colour: altColour(ac.alt_baro), labelText: labelFor(ac),
    lastSeen: Date.now(),
    points: [[ac.lat, ac.lon]],
    trail: L.polyline([[ac.lat, ac.lon]], { weight: 2, opacity: 0.5, color: altColour(ac.alt_baro) }).addTo(map),
  };
  entry.els.plane.style.transform = `rotate(${entry.disp.hdg}deg)`;
  entry.popupEl = document.createElement("div");
  entry.popupEl.innerHTML = '<div class="pop-photos"></div><div class="pop-info"></div>';
  L.DomEvent.disableClickPropagation(entry.popupEl);   // dragging the photo strip must not pan the map
  marker.bindPopup(entry.popupEl, { minWidth: 270, maxWidth: 270, autoPan: false });
  marker.on("popupopen", () => { openPlane(entry); requestAnimationFrame(() => keepPopupInView(entry)); });
  marker.on("popupclose", () => { selectedHex = null; clearRoute(); releasePhotoUrls(entry); });
  return entry;
}

let lastFrame = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (document.hidden || zooming || ts - lastFrame < FRAME_MS) return;
  const dt = ts - lastFrame;
  lastFrame = ts;
  const now = Date.now();
  const v = map.getBounds().pad(0.3);
  const south = v.getSouth(), north = v.getNorth(), west = v.getWest(), east = v.getEast();
  // Size of half a screen pixel in degrees at this zoom. Planes that haven't moved that far
  // are left alone, which saves almost all the work when zoomed out over a busy sky.
  const pxLon = 360 / (256 * 2 ** map.getZoom()) * 0.5;

  for (const entry of aircraft.values()) {
    const p = project(entry.rep, now);
    const k = Math.exp(-(now - entry.offT) / (BLEND_MS / 2.5));
    const lat = p.lat + entry.off.lat * k;
    const lon = p.lon + entry.off.lon * k;

    // ease the nose towards the reported heading by the short way round
    const target = entry.rep.track;
    if (target != null) {
      const diff = ((target - entry.disp.hdg + 540) % 360) - 180;
      entry.disp.hdg = (entry.disp.hdg + diff * (1 - Math.exp(-dt / 350)) + 360) % 360;
    }
    entry.disp.lat = lat;
    entry.disp.lon = lon;

    const selected = entry.data.hex === selectedHex;
    if (!selected && (lat < south || lat > north || lon < west || lon > east)) continue;   // off screen

    const d = entry.drawn;
    if (Math.abs(lon - d.lon) >= pxLon || Math.abs(lat - d.lat) >= pxLon * Math.cos(lat * RAD)) {
      entry.marker.setLatLng({ lat, lng: lon });
      d.lat = lat; d.lon = lon;
    }
    if (Math.abs(entry.disp.hdg - d.hdg) >= 0.4) {
      entry.els.plane.style.transform = `rotate(${entry.disp.hdg.toFixed(1)}deg)`;
      d.hdg = entry.disp.hdg;
    }

    if (selected) {
      entry.trail.setLatLngs([...entry.points, [lat, lon]]);
      if (routeGeom) routeGeom.line.setLatLngs([routeGeom.from, [lat, lon], routeGeom.to]);
    }
  }
}
requestAnimationFrame(frame);

// ---- Fetch + draw ----
function viewRadiusNm() {
  const c = map.getCenter();
  const corner = map.getBounds().getNorthEast();
  const nm = map.distance(c, corner) / 1852;
  return Math.min(MAX_RADIUS_NM, Math.max(10, Math.ceil(nm)));
}

// When the feed took its snapshot. Trust it only if this device's clock agrees (within a minute).
function snapTime(nowField) {
  let n = Number(nowField);
  if (n && n < 1e11) n *= 1000;
  return n && Math.abs(Date.now() - n) < 60000 ? n : Date.now();
}

let inFlight = false;
async function refresh() {
  if (inFlight || document.hidden) return;
  inFlight = true;
  try {
    const c = map.getCenter();
    const r = viewRadiusNm();
    const lat = c.lat.toFixed(4), lon = c.lng.toFixed(4);
    const res = await fetch(`${PROXY_URL}/api/lat/${lat}/lon/${lon}/dist/${r}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();

    const snapT = snapTime(json.now);
    const list = (json.ac || json.aircraft || []).filter(a => a.lat != null && a.lon != null);
    draw(list, snapT);
    const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    statusEl.textContent = `${list.length} aircraft · ${t}${locNote}`;
  } catch (e) {
    statusEl.textContent = "Feed error: " + e.message;
  } finally {
    inFlight = false;
  }
}

// Adds or updates planes from a feed snapshot. With prune on (the normal polling case) planes
// the feed no longer reports are removed; a search result is added with prune off.
function draw(list, snapT, prune = true) {
  const now = Date.now();
  const seen = new Set();
  for (const ac of list) {
    seen.add(ac.hex);
    const rep = makeRep(ac, snapT);
    let entry = aircraft.get(ac.hex);
    if (!entry) {
      aircraft.set(ac.hex, makeEntry(ac, rep));
      continue;
    }
    entry.lastSeen = now;
    if (rep.t < entry.rep.t) continue;                       // an older snapshot arrived late: ignore it

    // Keep the on-screen position continuous: remember how far the prediction was off, then fade it out
    const target = project(rep, now);
    const gapLat = entry.disp.lat - target.lat, gapLon = entry.disp.lon - target.lon;
    const gapNm = Math.hypot(gapLat * 60, gapLon * 60 * Math.cos(target.lat * RAD));
    entry.off = gapNm > 3 ? { lat: 0, lon: 0 } : { lat: gapLat, lon: gapLon };   // big jumps just snap
    entry.offT = now;
    entry.rep = rep;
    entry.data = ac;

    const last = entry.points[entry.points.length - 1];
    if (last[0] !== ac.lat || last[1] !== ac.lon) {
      entry.points.push([ac.lat, ac.lon]);
      if (entry.points.length > TRAIL_POINTS) entry.points.shift();
      entry.trail.setLatLngs(entry.points);
    }

    const colour = altColour(ac.alt_baro);
    if (colour !== entry.colour) {
      entry.colour = colour;
      entry.els.path.setAttribute("fill", colour);
      entry.trail.setStyle({ color: colour });
    }
    const label = labelFor(ac);
    if (label !== entry.labelText) {
      entry.labelText = label;
      entry.els.label.textContent = label;
    }

    if (entry.marker.isPopupOpen()) {
      refreshPopup(entry);
      drawRoute(entry);
    }
  }
  if (!prune) return;

  // Drop planes the feed no longer reports, after a short grace period for brief dropouts
  for (const [hex, entry] of aircraft) {
    if (!seen.has(hex) && now - entry.lastSeen > KEEP_MISSING_MS) {
      map.removeLayer(entry.marker);
      map.removeLayer(entry.trail);
      if (selectedHex === hex) { selectedHex = null; clearRoute(); }
      aircraft.delete(hex);
    }
  }
}

// ---- Small UI helpers ----
let toastTimer;
function toast(msg, ms = 2600) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}

// ---- My photos ----
// Photos you add are stored in this browser (IndexedDB) on this device. They are never uploaded
// anywhere, and each is filed under the aircraft's registration so it shows up whenever that
// exact aircraft is on the map. Photos are shrunk before saving to keep storage small.
const MAX_FULL = 1600, MAX_THUMB = 480;
const photoInput = document.getElementById("photoInput");
let pendingPhoto = null;
let dbPromise = null;

function photoDb() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open("overhead", 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore("photos", { keyPath: "id", autoIncrement: true }).createIndex("key", "key");
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => { dbPromise = null; reject(req.error); };
    });
  }
  return dbPromise;
}
const photoKey = ac => String(ac.r || ac.hex).toUpperCase();

async function photosFor(key) {
  const db = await photoDb();
  return new Promise((resolve, reject) => {
    const req = db.transaction("photos").objectStore("photos").index("key").getAll(key);
    req.onsuccess = () => resolve(req.result.sort((a, b) => b.addedAt - a.addedAt));   // newest first
    req.onerror = () => reject(req.error);
  });
}
async function addPhotoRecord(rec) {
  const db = await photoDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("photos", "readwrite");
    tx.objectStore("photos").add(rec);
    tx.oncomplete = () => resolve();
    tx.onerror = tx.onabort = () => reject(tx.error);
  });
}
async function deletePhotoRecord(id) {
  const db = await photoDb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction("photos", "readwrite");
    tx.objectStore("photos").delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = tx.onabort = () => reject(tx.error);
  });
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("unreadable image")); };
    img.src = url;
  });
}
function shrinkToBlob(img, max, quality) {
  const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale)), h = Math.max(1, Math.round(img.naturalHeight * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);   // browsers apply the photo's rotation (EXIF) here
  return new Promise((resolve, reject) =>
    canvas.toBlob(b => b ? resolve(b) : reject(new Error("couldn't encode")), "image/jpeg", quality));
}

async function addPhotoFiles(target, files) {
  let added = 0, failed = 0;
  for (const file of files) {
    try {
      const img = await loadImage(file);
      const full = await shrinkToBlob(img, MAX_FULL, 0.85);
      const thumb = await shrinkToBlob(img, MAX_THUMB, 0.8);
      await addPhotoRecord({ key: target.key, hex: target.hex, reg: target.reg, type: target.type,
                             callsign: target.callsign, addedAt: Date.now() + added, full, thumb });
      added++;
    } catch (e) { failed++; }
  }
  try { navigator.storage?.persist?.(); } catch (e) { /* ignore */ }   // ask the browser not to evict them
  return { added, failed };
}

function releasePhotoUrls(entry) {
  (entry.urls || []).forEach(u => URL.revokeObjectURL(u));
  entry.urls = [];
}

async function renderPhotos(entry) {
  const box = entry.popupEl.querySelector(".pop-photos");
  const ac = entry.data;
  let list;
  try { list = await photosFor(photoKey(ac)); }
  catch (e) { box.replaceChildren(); return; }               // storage unavailable here: quietly hide the feature
  if (!entry.marker.isPopupOpen()) return;

  releasePhotoUrls(entry);
  const url = blob => { const u = URL.createObjectURL(blob); entry.urls.push(u); return u; };
  const grow = () => keepPopupInView(entry);
  const add = () => {
    pendingPhoto = { entry, key: photoKey(ac), hex: ac.hex, reg: ac.r || "", type: ac.t || "", callsign: (ac.flight || "").trim() };
    photoInput.click();
  };

  const nodes = [];
  if (!list.length) {
    const b = document.createElement("button");
    b.className = "addphoto"; b.type = "button"; b.textContent = "📷 Add your photo"; b.onclick = add;
    nodes.push(b);
  } else {
    const hero = document.createElement("img");
    hero.className = "hero"; hero.alt = ""; hero.src = url(list[0].thumb);
    hero.onload = grow; hero.onclick = () => openLightbox(list, 0, entry);
    nodes.push(hero);
    const strip = document.createElement("div");
    strip.className = "thumbs";
    list.forEach((p, i) => {
      const t = document.createElement("img");
      t.alt = ""; t.src = url(p.thumb); t.onclick = () => openLightbox(list, i, entry);
      strip.append(t);
    });
    const plus = document.createElement("button");
    plus.type = "button"; plus.textContent = "＋"; plus.setAttribute("aria-label", "Add another photo"); plus.onclick = add;
    strip.append(plus);
    nodes.push(strip);
  }
  box.replaceChildren(...nodes);
  grow();
}

photoInput.addEventListener("change", async () => {
  const files = [...photoInput.files];
  photoInput.value = "";                                      // so picking the same photo again still fires
  const target = pendingPhoto; pendingPhoto = null;
  if (!target || !files.length) return;
  toast("Saving…", 15000);
  const { added, failed } = await addPhotoFiles(target, files);
  toast(added
    ? `Added ${added} photo${added > 1 ? "s" : ""}${failed ? `; ${failed} couldn't be read` : ""}`
    : "Couldn't read that image. Try a JPEG or PNG.");
  if (target.entry.marker.isPopupOpen()) renderPhotos(target.entry);
});

// Full-screen viewer
const lightboxEl = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lb = { list: [], i: 0, entry: null, url: null };

function showLightbox() {
  const p = lb.list[lb.i];
  if (lb.url) URL.revokeObjectURL(lb.url);
  lb.url = URL.createObjectURL(p.full);
  lbImg.src = lb.url;
  const date = new Date(p.addedAt).toLocaleDateString([], { day: "numeric", month: "short", year: "numeric" });
  document.getElementById("lbCap").textContent = [p.reg || String(p.hex).toUpperCase(), p.type, p.callsign, date].filter(Boolean).join(" · ");
  const many = lb.list.length > 1;
  document.getElementById("lbPrev").hidden = !many;
  document.getElementById("lbNext").hidden = !many;
  document.getElementById("lbCount").textContent = many ? `${lb.i + 1} / ${lb.list.length}` : "";
}
function openLightbox(list, i, entry) { lb.list = list; lb.i = i; lb.entry = entry; showLightbox(); lightboxEl.hidden = false; }
function closeLightbox() {
  lightboxEl.hidden = true;
  lbImg.removeAttribute("src");
  if (lb.url) { URL.revokeObjectURL(lb.url); lb.url = null; }
}
function stepLightbox(d) { lb.i = (lb.i + d + lb.list.length) % lb.list.length; showLightbox(); }

document.getElementById("lbClose").onclick = closeLightbox;
document.getElementById("lbPrev").onclick = () => stepLightbox(-1);
document.getElementById("lbNext").onclick = () => stepLightbox(1);
lightboxEl.addEventListener("click", e => { if (e.target === lightboxEl) closeLightbox(); });
document.getElementById("lbDel").onclick = async () => {
  if (!confirm("Delete this photo from this device?")) return;
  const p = lb.list[lb.i];
  try { await deletePhotoRecord(p.id); } catch (e) { toast("Couldn't delete that photo"); return; }
  lb.list.splice(lb.i, 1);
  if (!lb.list.length) closeLightbox();
  else { lb.i = Math.min(lb.i, lb.list.length - 1); showLightbox(); }
  if (lb.entry) renderPhotos(lb.entry);
};
let swipeX = null;
lightboxEl.addEventListener("touchstart", e => { swipeX = e.touches[0].clientX; }, { passive: true });
lightboxEl.addEventListener("touchend", e => {
  if (swipeX == null) return;
  const dx = e.changedTouches[0].clientX - swipeX; swipeX = null;
  if (Math.abs(dx) > 60 && lb.list.length > 1) stepLightbox(dx < 0 ? 1 : -1);
});

// ---- Search ----
// Typing filters the aircraft already on your map instantly; pressing Go also asks the feeds,
// which finds a plane anywhere in the world as long as it is airborne and being tracked.
const searchEl = document.getElementById("search");
const qEl = document.getElementById("q");
const resultsEl = document.getElementById("results");
let searchSeq = 0;
let shown = [];            // what the results list currently shows: [{ ac, snapT }]

function openSearch() { searchEl.hidden = false; qEl.focus(); showLocal(); }
function closeSearch() { searchEl.hidden = true; qEl.blur(); searchSeq++; }

function hint(text) { shown = []; resultsEl.innerHTML = `<div class="hint">${esc(text)}</div>`; }

function localMatches(q) {
  const norm = s => String(s || "").toUpperCase().replace(/[\s-]/g, "");
  const needle = norm(q);
  if (needle.length < 2) return [];
  const out = [];
  for (const e of aircraft.values()) {
    const a = e.data;
    if ([(a.flight || "").trim(), a.r, a.hex, a.t].some(f => norm(f).includes(needle))) out.push({ ac: a, snapT: Date.now() });
  }
  return out;
}

function showResults(items, note) {
  const c = map.getCenter();
  const nm = a => distNm(c.lat, c.lng, a.lat, a.lon);
  shown = [...items].sort((x, y) => nm(x.ac) - nm(y.ac)).slice(0, 30);
  resultsEl.innerHTML = (note ? `<div class="hint">${esc(note)}</div>` : "") + shown.map((r, i) => {
    const a = r.ac;
    const title = (a.flight || "").trim() || a.r || a.hex;
    const detail = [a.r, fmtAlt(a.alt_baro), a.gs != null ? Math.round(a.gs) + " kt" : "",
                    Math.round(nm(a)).toLocaleString() + " nm from map centre"].filter(Boolean).join(" · ");
    return `<button type="button" class="res" data-i="${i}"><span class="r1"><b>${esc(title)}</b><i>${esc(a.t || "")}</i></span><span class="r2">${esc(detail)}</span></button>`;
  }).join("");
}

function showLocal() {
  const q = qEl.value.trim();
  if (q.length < 2) return hint("Search by callsign (BAW117), flight number (BA117), registration (G-XWBA), ICAO hex code or aircraft type (A388). Press Go to search all live aircraft.");
  const items = localMatches(q);
  if (items.length) showResults(items, "On your map now. Press Go to search everywhere.");
  else hint("Nothing on your map matches. Press Go to search everywhere.");
}
qEl.addEventListener("input", showLocal);

document.getElementById("searchForm").addEventListener("submit", async e => {
  e.preventDefault();
  const q = qEl.value.trim();
  if (q.length < 2) return;
  const seq = ++searchSeq;
  hint("Searching…");
  try {
    const res = await fetch(`${PROXY_URL}/api/find?q=${encodeURIComponent(q)}`);
    const json = await res.json();
    if (seq !== searchSeq) return;                              // a newer search or closing the panel wins
    if (!res.ok) return hint(json.error || "Search failed.");
    if (json.failed) return hint("Couldn't reach the flight feeds. Try again in a moment.");
    const snapT = snapTime(json.now);
    const items = (json.ac || []).map(ac => ({ ac, snapT }));
    const have = new Set(items.map(r => r.ac.hex));
    localMatches(q).forEach(r => { if (!have.has(r.ac.hex)) items.push(r); });
    if (!items.length) {
      return hint(`No live aircraft found for "${q.toUpperCase()}". It may not be flying or tracked right now. Airlines broadcast 3-letter callsigns (BAW117), and flight numbers like BA117 are translated for the main airlines.`);
    }
    const m = json.matched;
    const note = m && m.kind === "callsign" && m.value !== json.query ? `Showing ${m.value} for flight number ${json.query}` :
                 m && m.kind === "type" ? `Aircraft of type ${m.value}, nearest first` : "";
    showResults(items, note);
  } catch (err) {
    if (seq === searchSeq) hint("Search failed. Check your connection and try again.");
  }
});

resultsEl.addEventListener("click", e => {
  const b = e.target.closest(".res");
  if (b && shown[+b.dataset.i]) pickResult(shown[+b.dataset.i]);
});

function pickResult(r) {
  closeSearch();
  let entry = aircraft.get(r.ac.hex);
  if (!entry) { draw([r.ac], r.snapT, false); entry = aircraft.get(r.ac.hex); }
  const at = entry ? [entry.disp.lat, entry.disp.lon] : [r.ac.lat, r.ac.lon];
  map.setView(at, Math.max(map.getZoom(), 9), { animate: false });
  if (entry) setTimeout(() => entry.marker.openPopup(), 60);
}

document.getElementById("searchBtn").addEventListener("click", () => { searchEl.hidden ? openSearch() : closeSearch(); });
document.getElementById("searchClose").addEventListener("click", closeSearch);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!lightboxEl.hidden) closeLightbox(); else if (!searchEl.hidden) closeSearch();
});

// ---- Location ----
// iPhone home-screen apps can lose or re-ask for location permission, so a failed fix is never
// fatal: the map just stays where you last left it, and the status pill says what happened.
let locNote = "";
function locate(initial) {
  if (!navigator.geolocation) { locNote = " · no location"; refresh(); return; }
  statusEl.textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(pos => {
    locNote = "";
    const ll = [pos.coords.latitude, pos.coords.longitude];
    map.setView(ll, Math.max(map.getZoom(), 10));
    if (youMarker) youMarker.setLatLng(ll);
    else youMarker = L.circleMarker(ll, { radius: 6, color: "#fff", weight: 2, fillColor: "#3b82f6", fillOpacity: 1 }).addTo(map);
    refresh();
  }, err => {
    locNote = err.code === 1 ? " · location blocked" : " · no location fix";
    refresh();
  }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
}

document.getElementById("locate").addEventListener("click", () => locate(false));
let moveTimer;
map.on("moveend", () => { clearTimeout(moveTimer); moveTimer = setTimeout(refresh, 700); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

locate(true);
setInterval(refresh, POLL_MS);

// Lets the app open instantly and launch without signal (see sw.js)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("/sw.js").catch(() => {}); });
}
</script>
