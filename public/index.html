<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1720">
<title>Overhead</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  html, body { margin: 0; height: 100%; background: #0f1720; font-family: system-ui, -apple-system, sans-serif; }
  #map { position: absolute; inset: 0; background: #1b1f24; }
  /* Turn the standard OSM tiles into a dark map (set to "none" for a light map) */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.7); }
  .bar {
    position: absolute; z-index: 1000; left: 10px; right: 10px;
    top: calc(env(safe-area-inset-top) + 10px);
    display: flex; gap: 8px; align-items: center; justify-content: space-between;
    pointer-events: none;
  }
  .pill {
    pointer-events: auto; background: rgba(15,23,32,.88); color: #e6edf3;
    padding: 8px 12px; border-radius: 999px; font-size: 13px;
    border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(6px);
  }
  button.pill { font: inherit; font-size: 13px; cursor: pointer; }
  .plane { transition: transform .2s linear; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  .plane svg { display: block; }
  .label {
    position: absolute; left: 20px; top: -2px; white-space: nowrap;
    font-size: 11px; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000;
    pointer-events: none;
  }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.5; }
  .leaflet-popup-content b { font-size: 15px; }
  .row { display: flex; justify-content: space-between; gap: 16px; }
  .row span:first-child { color: #667; }
  .row span:last-child { text-align: right; }
  .muted { color: #889; font-size: 12px; margin: 4px 0; }
  .airline { font-size: 12px; color: #667; margin-bottom: 2px; }
  .route { margin: 6px 0 8px; padding: 8px 10px; border-radius: 8px; background: rgba(120,140,170,.15); }
  .route .codes { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  .route .arrow { flex: 1; text-align: center; color: #889; font-weight: 400; }
  .route .cities { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: #667; margin-top: 2px; }
  .route .cities span:last-child { text-align: right; }
  .apt-tip { font-weight: 700; }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <div class="pill" id="status">Starting…</div>
  <button class="pill" id="locate">📍 Locate me</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- Settings you may want to tweak ----
// Leave empty when this page is hosted on the same Cloudflare site as _worker.js.
// For testing on localhost, set it to your deployed site, e.g. "https://flights.pages.dev".
const PROXY_URL = "";
const POLL_MS = 8000;
const MAX_RADIUS_NM = 250;
const TRAIL_POINTS = 25;
const DEFAULT_CENTER = [53.7938, -1.7564];          // fallback if location is denied
const DEFAULT_ZOOM = 9;

// ---- Map ----
const map = L.map("map", { zoomControl: false, attributionControl: true })
  .setView(DEFAULT_CENTER, DEFAULT_ZOOM);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

L.control.zoom({ position: "bottomright" }).addTo(map);

const statusEl = document.getElementById("status");
const aircraft = new Map();   // hex -> { marker, trail, points }
let youMarker = null;

// ---- Helpers ----
function altColour(alt) {
  if (alt === "ground" || alt == null) return "#9aa5b1";
  if (alt < 2000)  return "#ff6b6b";
  if (alt < 10000) return "#ffb347";
  if (alt < 25000) return "#f4e04d";
  if (alt < 35000) return "#4fd1c5";
  return "#63b3ff";
}

function planeIcon(ac) {
  const colour = altColour(ac.alt_baro);
  const rot = ac.track ?? 0;
  const label = esc((ac.flight || "").trim() || ac.r || ac.hex);
  return L.divIcon({
    className: "",
    iconSize: [24, 24],
    iconAnchor: [12, 12],
    popupAnchor: [0, -10],
    html: `
      <div class="plane" style="transform: rotate(${rot}deg)">
        <svg width="24" height="24" viewBox="0 0 24 24">
          <path fill="${colour}" stroke="#0f1720" stroke-width="1"
            d="M12 1.5c.9 0 1.5.8 1.5 1.8v6.2l8 4.6v2.2l-8-2.3v4.6l2.3 1.7V22L12 20.7 8.2 22v-1.7l2.3-1.7v-4.6l-8 2.3v-2.2l8-4.6V3.3c0-1 .6-1.8 1.5-1.8z"/>
        </svg>
      </div>
      <div class="label">${label}</div>`
  });
}

function fmtAlt(a) {
  if (a === "ground") return "On ground";
  if (a == null) return "–";
  return a >= 18000 ? `FL${Math.round(a / 100)}` : `${a.toLocaleString()} ft`;
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- Aircraft / route details (looked up when you tap a plane) ----
// infoCache values: {aircraft, flightroute} | "none" | "error"; undefined = not requested yet.
const infoCache = new Map();
const infoPending = new Set();
const infoKey = ac => ac.hex + "|" + (ac.flight || "").trim();

async function loadInfo(ac) {
  const key = infoKey(ac);
  const cached = infoCache.get(key);
  if (infoPending.has(key) || (cached && cached !== "error")) return;
  if (!/^[0-9a-f]{6}$/i.test(ac.hex)) { infoCache.set(key, "none"); return; }   // e.g. TIS-B targets
  infoPending.add(key);
  try {
    const cs = (ac.flight || "").trim();
    const q = cs ? `?callsign=${encodeURIComponent(cs)}` : "";
    const res = await fetch(`${PROXY_URL}/api/info/${ac.hex}${q}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    infoCache.set(key, json.aircraft || json.flightroute ? json : "none");
  } catch (e) {
    infoCache.set(key, "error");
  } finally {
    infoPending.delete(key);
  }
}

function distNm(lat1, lon1, lat2, lon2) {
  const t = Math.PI / 180, dLat = (lat2 - lat1) * t, dLon = (lon2 - lon1) * t;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * t) * Math.cos(lat2 * t) * Math.sin(dLon / 2) ** 2;
  return 2 * 3440.065 * Math.asin(Math.sqrt(x));
}

function fmtDur(min) {
  if (min < 1) return "<1 min";
  return min < 60 ? `${Math.round(min)} min` : `${Math.floor(min / 60)} h ${Math.round(min % 60)} min`;
}

function popupHtml(ac) {
  const callsign = (ac.flight || "").trim();
  const info = infoCache.get(infoKey(ac));
  const ready = info && typeof info === "object";
  const fr = ready ? info.flightroute : null;
  const am = ready ? info.aircraft : null;
  const row = (k, v) => v == null || v === "" ? "" : `<div class="row"><span>${k}</span><span>${esc(v)}</span></div>`;
  const rowAlways = (k, v) => `<div class="row"><span>${k}</span><span>${esc(v ?? "–")}</span></div>`;

  const airline = fr?.airline?.name || null;

  // Route block
  let routeBlock = "";
  let toGo = null;
  if (fr?.origin && fr?.destination) {
    const o = fr.origin, d = fr.destination;
    const code = a => a.iata_code || a.icao_code || "?";
    const city = a => a.municipality || a.name || "";
    routeBlock = `
      <div class="route">
        <div class="codes"><span>${esc(code(o))}</span><span class="arrow">✈</span><span>${esc(code(d))}</span></div>
        <div class="cities"><span>${esc(city(o))}</span><span>${esc(city(d))}</span></div>
      </div>`;
    if (d.latitude != null && d.longitude != null && ac.alt_baro !== "ground" && ac.gs > 50) {
      const nm = distNm(ac.lat, ac.lon, d.latitude, d.longitude);
      toGo = `${Math.round(nm).toLocaleString()} nm · ~${fmtDur(nm / ac.gs * 60)}`;
    }
  } else if (info === undefined) {
    routeBlock = `<div class="muted">Looking up route…</div>`;
  } else if (info === "error") {
    routeBlock = `<div class="muted">Route lookup failed. Tap the plane again to retry.</div>`;
  } else if (callsign) {
    routeBlock = `<div class="muted">No route on file for ${esc(callsign)}</div>`;
  }

  const model = am ? [am.manufacturer, am.type].filter(Boolean).join(" ") : "";
  const aircraftName = model || ac.desc || ac.t;

  return `
    <b>${esc(callsign || "No callsign")}</b>
    ${airline ? `<div class="airline">${esc(airline)}</div>` : ""}
    ${routeBlock}
    ${row("To go (approx.)", toGo)}
    ${rowAlways("Aircraft", aircraftName)}
    ${row("Type code", ac.t)}
    ${row("Reg", ac.r || am?.registration)}
    ${row("Owner", am?.registered_owner)}
    ${row("Registered in", am?.registered_owner_country_name)}
    ${row("Built", ac.year)}
    ${rowAlways("Altitude", fmtAlt(ac.alt_baro))}
    ${rowAlways("Speed", ac.gs != null ? Math.round(ac.gs) + " kt" : null)}
    ${rowAlways("Heading", ac.track != null ? Math.round(ac.track) + "°" : null)}
    ${row("Vert. rate", ac.baro_rate != null ? ac.baro_rate + " ft/min" : null)}
    ${row("Squawk", ac.squawk)}
    ${row("ICAO hex", ac.hex)}
    ${fr ? `<div class="muted">Route comes from a schedule database, so it can differ from today's actual flight.</div>` : ""}`;
}

// Dashed line origin → plane → destination for the selected aircraft
let routeLayer = null;
function clearRoute() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
}
function drawRoute(ac) {
  clearRoute();
  const info = infoCache.get(infoKey(ac));
  const fr = info && typeof info === "object" ? info.flightroute : null;
  if (!fr?.origin || !fr?.destination) return;
  const o = fr.origin, d = fr.destination;
  if (o.latitude == null || d.latitude == null) return;
  const oPos = [o.latitude, o.longitude], dPos = [d.latitude, d.longitude];
  routeLayer = L.layerGroup([
    L.polyline([oPos, [ac.lat, ac.lon], dPos], { color: "#63b3ff", weight: 2, opacity: .8, dashArray: "6 6" }),
    L.circleMarker(oPos, { radius: 5, color: "#fff", weight: 2, fillColor: "#63b3ff", fillOpacity: 1 })
      .bindTooltip(esc(o.iata_code || o.icao_code || ""), { permanent: true, direction: "top", className: "apt-tip" }),
    L.circleMarker(dPos, { radius: 5, color: "#fff", weight: 2, fillColor: "#ff6b6b", fillOpacity: 1 })
      .bindTooltip(esc(d.iata_code || d.icao_code || ""), { permanent: true, direction: "top", className: "apt-tip" }),
  ]).addTo(map);
}

async function openPlane(entry) {
  const hex = entry.data.hex;
  await loadInfo(entry.data);
  const current = aircraft.get(hex);
  if (current && current.marker.isPopupOpen()) {
    current.marker.getPopup().setContent(popupHtml(current.data));
    drawRoute(current.data);
  }
}

// ---- Fetch + draw ----
function viewRadiusNm() {
  const c = map.getCenter();
  const corner = map.getBounds().getNorthEast();
  const nm = map.distance(c, corner) / 1852;
  return Math.min(MAX_RADIUS_NM, Math.max(10, Math.ceil(nm)));
}

let inFlight = false;
async function refresh() {
  if (inFlight || document.hidden) return;
  inFlight = true;
  try {
    const c = map.getCenter();
    const r = viewRadiusNm();
    const lat = c.lat.toFixed(4), lon = c.lng.toFixed(4);
    const res = await fetch(`${PROXY_URL}/api/lat/${lat}/lon/${lon}/dist/${r}`);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    const list = (json.ac || json.aircraft || []).filter(a => a.lat != null && a.lon != null);
    draw(list);
    const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    statusEl.textContent = `${list.length} aircraft · ${t}`;
  } catch (e) {
    statusEl.textContent = "Feed error: " + e.message;
  } finally {
    inFlight = false;
  }
}

function draw(list) {
  const seen = new Set();
  for (const ac of list) {
    seen.add(ac.hex);
    const pos = [ac.lat, ac.lon];
    let entry = aircraft.get(ac.hex);
    if (!entry) {
      const marker = L.marker(pos, { icon: planeIcon(ac) }).addTo(map);
      marker.bindPopup(() => popupHtml(entry.data), { minWidth: 230, maxWidth: 300 });
      marker.on("popupopen", () => openPlane(entry));
      marker.on("popupclose", clearRoute);
      const trail = L.polyline([pos], { weight: 2, opacity: 0.5, color: altColour(ac.alt_baro) }).addTo(map);
      entry = { marker, trail, points: [pos], data: ac };
      aircraft.set(ac.hex, entry);
    } else {
      entry.data = ac;
      entry.marker.setLatLng(pos);
      entry.marker.setIcon(planeIcon(ac));
      entry.points.push(pos);
      if (entry.points.length > TRAIL_POINTS) entry.points.shift();
      entry.trail.setLatLngs(entry.points);
      entry.trail.setStyle({ color: altColour(ac.alt_baro) });
      if (entry.marker.isPopupOpen()) {
        entry.marker.getPopup().setContent(popupHtml(ac));
        drawRoute(ac);
      }
    }
  }
  for (const [hex, entry] of aircraft) {
    if (!seen.has(hex)) {
      map.removeLayer(entry.marker);
      map.removeLayer(entry.trail);
      aircraft.delete(hex);
    }
  }
}

// ---- Location ----
function locate(initial) {
  if (!navigator.geolocation) { refresh(); return; }
  statusEl.textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    map.setView(ll, 10);
    if (youMarker) youMarker.setLatLng(ll);
    else youMarker = L.circleMarker(ll, { radius: 6, color: "#fff", weight: 2, fillColor: "#3b82f6", fillOpacity: 1 }).addTo(map);
    refresh();
  }, () => {
    statusEl.textContent = initial ? "Location off, using default" : "Couldn't get location";
    refresh();
  }, { enableHighAccuracy: false, timeout: 8000 });
}

document.getElementById("locate").addEventListener("click", () => locate(false));
let moveTimer;
map.on("moveend", () => { clearTimeout(moveTimer); moveTimer = setTimeout(refresh, 700); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

locate(true);
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
